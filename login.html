<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Contato Certo SP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-[#F8FAFF] min-h-screen grid place-items-center p-4"><div class="bg-white rounded-[24px] border p-6 w-full max-w-[400px] shadow-xl"><h1 class="font-black text-[20px] text-[#0F2C59] text-center">Entrar com Usuário e Senha</h1><form onsubmit="login(event)" class="mt-6 grid gap-3"><input required id="usuario" placeholder="Usuário" class="h-12 px-4 rounded-xl border-2 bg-slate-50"><input required id="senha" type="password" placeholder="Senha" class="h-12 px-4 rounded-xl border-2 bg-slate-50"><button class="h-12 rounded-xl bg-[#0F2C59] text-white font-black">Entrar</button><a href="/cadastro.html" class="text-center text-[12px] text-[#FF7A00] font-bold underline">Não tem cadastro? Cadastre-se grátis</a></form></div><script>const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb=supabase.createClient(U,K);async function login(e){e.preventDefault();let u=document.getElementById('usuario').value.toLowerCase(),s=document.getElementById('senha').value;let r=await sb.from('profissionais').select('*').eq('usuario',u).eq('senha',s).maybeSingle();if(!r.data){alert('Usuário ou senha incorretos');return}localStorage.setItem('contatocerto_perfil_completo',JSON.stringify(r.data));location.href='/perfil.html';}</script></body></html>
