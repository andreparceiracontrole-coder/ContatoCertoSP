<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Apos Login Total Acesso</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="icon" href="/icon-192.png"></head><body class="bg-slate-50 min-h-screen grid place-items-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-[380px] border-2"><h1 class="font-black text-[16px]">Login - Apos login total acesso a plataforma e anuncios e planos</h1><form onsubmit="login(event)" class="mt-4 grid gap-3"><input required id="usuario" placeholder="Usuario" class="h-10 px-3 rounded-xl border bg-slate-50"><input required id="senha" type="password" placeholder="Senha" class="h-10 px-3 rounded-xl border bg-slate-50"><button type="submit" class="h-10 rounded-xl bg-black text-white font-black">Entrar - Total acesso liberado - 100% funcionando</button><a href="/cadastro.html" class="text-center text-[11px] text-blue-600 underline">Nao tem conta? Cadastro obrigatorio</a><a href="/" class="text-center text-[10px] text-zinc-500 underline">Voltar - 100% funcionando</a></form></div><script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb;try{sb=supabase.createClient(U,K)}catch(e){}
async function login(e){e.preventDefault();let u=document.getElementById('usuario').value.toLowerCase();let s=document.getElementById('senha').value;try{let r=await sb.from('profissionais').select('*').eq('usuario',u).eq('senha',s).maybeSingle();if(!r.data){alert('Usuario ou senha incorretos - Tente novamente');return}localStorage.setItem('contatocerto_cadastro_feito','1');localStorage.setItem('contatocerto_usuario_logado',u);localStorage.setItem('contatocerto_perfil_completo',JSON.stringify(r.data));alert('Login OK! Total acesso a plataforma e anuncios e planos liberado - 100% funcionando');location.href='/?login=ok&acesso=total';}catch(err){alert('Erro: '+err.message)}}
</script></body></html>
