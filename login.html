<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Após Cadastro Obrigatório</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="icon" href="/icon-192.png"></head><body class="bg-[#F8FAFF] min-h-screen grid place-items-center p-4">
<div class="bg-white rounded-[16px] border-2 border-blue-100 p-6 w-full max-w-[400px] shadow-xl">
<div class="text-center"><img src="/icon-192.png" class="w-12 h-12 rounded-full border-2 mx-auto"><h1 class="mt-3 text-[16px] font-black">Login - Após Cadastro Obrigatório</h1><p class="text-[9px] text-zinc-500 mt-1">Após cadastro obrigatório o usuário faz login - Depois poderá fazer anúncio com botão flutuante Anunciar</p></div>
<form onsubmit="login(event)" class="mt-5 grid gap-3">
<input required id="usuario" placeholder="Usuário" class="h-10 px-3 rounded-xl border-2 bg-slate-50 text-[11px]">
<input required id="senha" type="password" placeholder="Senha" class="h-10 px-3 rounded-xl border-2 bg-slate-50 text-[11px]">
<button type="submit" id="btnLogin" class="h-10 rounded-xl bg-slate-900 text-white font-black text-[11px]">Entrar - Login</button>
<div id="msg" class="text-[10px] text-center font-bold"></div>
<a href="/cadastro.html" class="text-center text-[10px] text-blue-600 font-bold underline block">Não tem cadastro? Cadastro obrigatório separado - 1 por telefone</a>
</form>
</div>
<script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb;try{sb=supabase.createClient(U,K)}catch(e){}
async function login(e){
e.preventDefault();
let btn=document.getElementById('btnLogin');btn.innerText='Entrando...';btn.disabled=true;
let u=document.getElementById('usuario').value.trim().toLowerCase();let s=document.getElementById('senha').value;
try{let r=await sb.from('profissionais').select('*').eq('usuario',u).eq('senha',s).maybeSingle();if(!r.data){document.getElementById('msg').innerText='Usuário ou senha incorretos';btn.disabled=false;btn.innerText='Entrar';return;}localStorage.setItem('contatocerto_cadastro_feito','1');localStorage.setItem('contatocerto_usuario_logado',u);localStorage.setItem('contatocerto_perfil_completo',JSON.stringify(r.data));document.getElementById('msg').innerText='✅ Login OK! Agora você pode fazer anúncio com botão flutuante Anunciar';setTimeout(()=>{location.href='/';},800);}catch(err){document.getElementById('msg').innerText='Erro: '+err.message;btn.disabled=false;}
}
</script></body></html>
