<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lista Clientes - Contato Certo SP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>html,body{overflow-x:hidden;max-width:100vw}*{box-sizing:border-box}</style></head><body class="bg-[#F8FAFF]">
<header class="bg-white border-b sticky top-0 z-50"><div class="max-w-[900px] mx-auto px-4 h-[64px] flex justify-between items-center"><div class="flex items-center gap-2"><div class="w-9 h-9 rounded-full bg-[#0F2C59] grid place-items-center text-white font-black">C</div><b class="text-[#0F2C59]">Lista Clientes</b></div><nav class="flex gap-2"><a href="/index.html" class="h-8 px-3 rounded-full border text-[12px] font-bold grid place-items-center">Início</a><a href="/planos.html" class="h-8 px-3 rounded-full bg-[#FFD60A] text-[12px] font-bold grid place-items-center">Planos</a><a href="/perfil.html" class="h-8 px-3 rounded-full bg-[#0F2C59] text-white text-[12px] font-bold grid place-items-center">Perfil</a></nav></div></header>
<main class="max-w-[700px] mx-auto p-4"><div class="bg-white rounded-[20px] border p-5"><h1 class="font-black text-[18px] text-[#0F2C59]">Clientes buscando serviços - Tempo Real</h1><p class="text-[12px] text-zinc-500">Lista borrada - só Ouro R$39,90 ou Avulso R$8,99 5h por dia vê sem borrar</p><div id="aviso" class="mt-3 p-3 rounded-xl text-[12px] hidden border-2"></div><div id="status" class="mt-2 text-[11px] font-bold px-3 py-1 rounded-full bg-zinc-100 inline-block">Verificando plano...</div><div id="lista" class="mt-5 grid gap-3">Carregando clientes...</div></div></main>
<div id="modal" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/60" onclick="closeM()"></div><div class="relative max-w-[360px] mx-auto mt-[20vh] bg-white rounded-[20px] p-6 m-4 text-center shadow-2xl"><h2 class="font-black text-[16px]">Liberar lista 5h por R$8,99</h2><p class="text-[12px] text-zinc-600 mt-2">Após 5h borra de novo. Pode pagar 1x por dia.</p><div class="mt-4 grid gap-2"><button onclick="pagar()" class="h-11 rounded-full bg-blue-600 text-white font-black">Já paguei - Liberar 5h</button><button onclick="closeM()" class="h-10 rounded-full border font-bold">Cancelar</button></div></div></div>
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#0F2C59] text-white px-5 py-3 rounded-full text-[13px] font-bold hidden"></div>
<script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb=supabase.createClient(U,K);
let plano='basic',acesso=false,expira=null;
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
function verificar(){let p=JSON.parse(localStorage.getItem('contatocerto_perfil_completo')||'{}');plano=p.plano||'basic';let av=localStorage.getItem('contatocerto_avulso_expira');if(av){expira=new Date(av);if(new Date()<expira)acesso=true}let avEl=document.getElementById('aviso'),st=document.getElementById('status');if(plano==='ouro'){acesso=true;st.innerText='OURO - Acesso total sem borrar';avEl.innerHTML='Você é Ouro - acesso total + selo dourado + lista sem borrar';avEl.className='mt-3 p-3 rounded-xl text-[12px] bg-green-50 border-2 border-green-200';avEl.classList.remove('hidden')}else if(acesso){st.innerText='Avulso liberado até '+expira.toLocaleTimeString('pt-BR');avEl.innerHTML='Avulso R$8,99 liberado até '+expira.toLocaleTimeString('pt-BR')+' - depois borra';avEl.className='mt-3 p-3 rounded-xl text-[12px] bg-blue-50 border-2 border-blue-200';avEl.classList.remove('hidden')}else{st.innerText='Borrada - só Ouro ou Avulso R$8,99';avEl.innerHTML='Lista borrada para '+plano+'. Só Ouro ou Avulso 5h <button onclick="openM()" class="mt-2 w-full h-9 rounded-full bg-blue-600 text-white font-bold text-[12px]">Pagar Avulso R$8,99 - 5h</button>';avEl.className='mt-3 p-3 rounded-xl text-[12px] bg-amber-50 border-2 border-amber-200';avEl.classList.remove('hidden')}}
async function carregar(){let g=document.getElementById('lista');try{let r=await sb.from('profissionais').select('*').eq('status','aprovado').order('created_at',{ascending:false}).limit(20);if(!r.data.length){g.innerHTML='<div class="text-center text-zinc-500 py-6">Nenhum cliente ainda - cadastre-se em /cadastro.html</div>';return}g.innerHTML=r.data.map(p=>{let bor=!acesso;return `<div class="border-2 ${bor?'border-red-100 bg-red-50/30':'border-green-200 bg-white'} rounded-[16px] p-4 relative overflow-hidden"><div class="${bor?'blur-[6px] select-none':''}"><b class="text-[13px] text-[#0F2C59]">${p.profissao} - ${p.cidade}</b><div class="text-[12px] font-bold mt-1">${p.nome} - ${p.telefone}</div><div class="text-[11px] text-zinc-600 mt-1">${p.bio||''}</div></div>${bor?'<div class="absolute inset-0 grid place-items-center bg-white/70"><div class="bg-white border-2 border-red-200 rounded-xl px-4 py-3 text-center shadow"><div class="font-black text-[12px]">Conteúdo borrado - só Ouro ou Avulso</div><button onclick="openM()" class="mt-2 h-8 px-4 rounded-full bg-blue-600 text-white font-bold text-[11px]">Liberar 5h R$8,99</button></div></div>':''}</div>`}).join('');}catch(e){g.innerHTML='Erro: '+e.message}}
function openM(){document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex')}function closeM(){document.getElementById('modal').classList.add('hidden')}
function pagar(){let ex=new Date(Date.now()+5*60*60*1000);localStorage.setItem('contatocerto_avulso_expira',ex.toISOString());toast('Liberado 5h!');closeM();verificar();carregar();}
verificar();carregar();
</script></body></html>
