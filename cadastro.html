<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro - Contato Certo SP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="icon" href="/icon-192.png"></head><body class="bg-[#F8FAFF]"><header class="bg-white border-b p-3 flex justify-between"><button onclick="location.href='/index.html'" class="font-black text-[11px]">CONTATO CERTO SP</button><button onclick="location.href='/login.html'" class="px-2 py-1 rounded-full border bg-white text-[10px]">Login</button></header><main class="max-w-[600px] mx-auto p-3"><div class="bg-green-600 text-white rounded-[14px] p-4"><h1 class="font-black text-[13px]">Cadastro - Ganhe Plano Ouro 30 dias Grátis!</h1><p class="text-[9px] text-white/80">50 primeiros ganham Ouro - Selo Ouro na foto + Topo sempre</p></div><div class="mt-3 bg-white rounded-[14px] border-2 border-green-200 p-4"><form onsubmit="cadastrar(event)" class="grid gap-3"><input required id="nome" placeholder="Nome completo" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] w-full"><input required id="cidade" placeholder="Cidade - SP" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] w-full"><input required id="tel" placeholder="WhatsApp com DDD" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] w-full"><input required id="email" type="email" placeholder="Email" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] w-full"><select required id="prof" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] w-full"><option value="">Profissão</option><option>Eletricista</option><option>Diarista</option><option>Pedreiro</option><option>Pintor</option><option>Encanador</option><option>Advogado</option></select><input required id="usuario" placeholder="Usuário para login" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] w-full"><input required id="senha" type="password" placeholder="Senha min 6" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] w-full"><input type="file" id="fotoFile" accept="image/*" class="h-9 px-2 rounded-xl border-2 bg-slate-50 text-[8px] w-full"><img id="preview" src="https://i.pravatar.cc/150" class="w-12 h-12 rounded-full border-2 mt-2"><textarea required id="bio" placeholder="Descrição do seu serviço" class="p-2 rounded-xl border-2 bg-slate-50 text-[10px] min-h-[60px] w-full"></textarea><button type="submit" id="btn" class="h-11 rounded-xl bg-green-600 text-white font-black text-[11px]">Finalizar Cadastro - Ganhar Ouro 30 dias</button></form></div></main><div id="modalOuro" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-black/60"></div><div class="relative max-w-[380px] mx-auto mt-[20vh] bg-white rounded-[16px] p-6 m-4 text-center shadow-2xl"><div class="w-16 h-16 bg-yellow-400 rounded-full grid place-items-center text-[28px] mx-auto">🏆</div><h2 class="mt-3 font-black text-[16px]">Parabéns! Você ganhou Plano Ouro por 30 dias!</h2><p class="text-[11px] text-zinc-600 mt-2">Seu anúncio vai ficar sempre no topo + Selo Ouro dourado na foto + Acesso à lista de clientes</p><button onclick="location.href='/login.html'" class="mt-4 w-full h-10 rounded-xl bg-slate-900 text-white font-black text-[11px]">Fazer Login Agora</button></div></div><div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-full text-[10px] hidden"></div><script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb;try{sb=supabase.createClient(U,K)}catch(e){}
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000)}
let fotoFinal="";document.getElementById('fotoFile')?.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=150;c.height=150;c.getContext('2d').drawImage(img,0,0,150,150);fotoFinal=c.toDataURL('image/jpeg',0.7);document.getElementById('preview').src=fotoFinal;};img.src=ev.target.result;};r.readAsDataURL(f);});
async function cadastrar(e){e.preventDefault();let btn=document.getElementById('btn');btn.disabled=true;btn.innerText='Salvando...';let nome=document.getElementById('nome').value.trim();let cidade=document.getElementById('cidade').value.trim();let tel=document.getElementById('tel').value.replace(/\D/g,'');let email=document.getElementById('email').value.trim();let prof=document.getElementById('prof').value;let usuario=document.getElementById('usuario').value.trim().toLowerCase().replace(/\s/g,'');let senha=document.getElementById('senha').value;let bio=document.getElementById('bio').value.trim();if(!fotoFinal)fotoFinal='https://i.pravatar.cc/150?u='+usuario;let obj={nome:nome,cidade:cidade,telefone:tel,whatsapp:'55'+tel,email:email,categoria:prof,profissao:prof,usuario:usuario,senha:senha,foto:fotoFinal,foto_anuncio:fotoFinal,bio:bio,plano:'ouro',status:'aprovado',created_at:new Date().toISOString(),expira_em:new Date(Date.now()+30*24*60*60*1000).toISOString()};try{let r=await sb.from('profissionais').insert([obj]).select();if(r.error){toast('Erro: '+r.error.message);btn.disabled=false;btn.innerText='Tentar de novo';return}}catch(err){toast('Erro: '+err.message);btn.disabled=false;return}document.getElementById('modalOuro').classList.remove('hidden');setTimeout(()=>{location.href='/login.html'},3000);}
</script></body></html>
