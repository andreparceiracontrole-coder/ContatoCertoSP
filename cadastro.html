<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro - Contato Certo SP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="icon" href="/icon-192.png"><style>html,body{overflow-x:hidden}</style></head><body class="bg-[#F8FAFF]"><header class="bg-white border-b p-3 flex justify-between"><button onclick="location.href='/index.html'" class="font-black text-[11px]">CONTATO CERTO SP</button><button onclick="location.href='/login.html'" class="px-2 py-1 rounded-full border bg-white text-[10px]">Login</button></header><main class="max-w-[600px] mx-auto p-3"><div class="bg-slate-900 text-white rounded-[14px] p-4"><h1 class="font-black text-[13px]">Cadastro obrigatório - 50 primeiros ganham Ouro grátis!</h1></div><div class="mt-3 bg-white rounded-[14px] border-2 border-blue-100 p-4"><form onsubmit="cadastrar(event)" class="grid gap-3"><div class="grid grid-cols-1 md:grid-cols-2 gap-2"><div><label class="text-[8px] font-bold">Nome completo *</label><input required id="nome" placeholder="Seu nome completo" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] mt-1 w-full"></div><div><label class="text-[8px] font-bold">CPF 11 digitos *</label><input required id="cpf" placeholder="CPF 11 digitos" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] mt-1 w-full" maxlength="14"></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-2"><div><label class="text-[8px] font-bold">Cidade - SP *</label><input required id="cidade" placeholder="Cidade - SP" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] mt-1 w-full"></div><div><label class="text-[8px] font-bold">Telefone / WhatsApp *</label><input required id="tel" placeholder="Telefone WhatsApp" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] mt-1 w-full"></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-2"><div><label class="text-[8px] font-bold">Email *</label><input required id="email" type="email" placeholder="Email" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] mt-1 w-full"></div><div><label class="text-[8px] font-bold">Profissão *</label><select required id="prof" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] mt-1 w-full"><option value="">Profissão</option><option>Eletricista</option><option>Diarista</option><option>Pedreiro</option><option>Encanador</option><option>Pintor</option><option>Advogado</option></select></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-2"><div><label class="text-[8px] font-bold">Usuário *</label><input required id="usuario" placeholder="Usuário" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] mt-1 w-full"></div><div><label class="text-[8px] font-bold">Senha *</label><input required id="senha" type="password" placeholder="Senha" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[10px] mt-1 w-full"></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><div><label class="text-[8px] font-bold">Foto Perfil *</label><input type="file" id="fotoPerfilFile" accept="image/*" class="h-9 px-2 rounded-xl border-2 bg-slate-50 text-[8px] mt-1 w-full"><div class="mt-1 flex gap-2"><img id="previewPerfil" src="https://i.pravatar.cc/150" class="w-10 h-10 rounded-full border-2"><div class="text-[7px] text-zinc-500">Foto pela galeria</div></div><input id="fotoPerfilUrl" placeholder="Ou URL foto" class="mt-1 h-7 px-2 rounded-xl border bg-white text-[8px] w-full"></div><div><label class="text-[8px] font-bold">Foto Anúncio *</label><input type="file" id="fotoAnuncioFile" accept="image/*" class="h-9 px-2 rounded-xl border-2 bg-slate-50 text-[8px] mt-1 w-full"><div class="mt-1 flex gap-2"><img id="previewAnuncio" src="https://i.pravatar.cc/150?img=5" class="w-10 h-10 rounded-[10px] border-2"><div class="text-[7px] text-zinc-500">Foto anúncio</div></div><input id="fotoAnuncioUrl" placeholder="Ou URL foto anuncio" class="mt-1 h-7 px-2 rounded-xl border bg-white text-[8px] w-full"></div></div><div><label class="text-[8px] font-bold">Descrição *</label><textarea required id="bio" placeholder="Descrição do seu anúncio" class="p-2 rounded-xl border-2 bg-slate-50 text-[10px] min-h-[60px] mt-1 w-full"></textarea></div><button type="submit" class="h-10 rounded-xl bg-slate-900 text-white font-black text-[11px]">Finalizar Cadastro - Notifica ADM no WhatsApp</button></form></div></main><div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-3 py-1 rounded-full text-[9px] hidden"></div><script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb;try{sb=supabase.createClient(U,K)}catch(e){}
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2000)}
document.getElementById('fotoPerfilFile')?.addEventListener('change',function(e){let file=e.target.files[0];if(file){let reader=new FileReader();reader.onload=function(ev){document.getElementById('previewPerfil').src=ev.target.result;document.getElementById('fotoPerfilUrl').value=ev.target.result};reader.readAsDataURL(file)}});
document.getElementById('fotoAnuncioFile')?.addEventListener('change',function(e){let file=e.target.files[0];if(file){let reader=new FileReader();reader.onload=function(ev){document.getElementById('previewAnuncio').src=ev.target.result;document.getElementById('fotoAnuncioUrl').value=ev.target.result};reader.readAsDataURL(file)}});
async function cadastrar(e){e.preventDefault();let nome=document.getElementById('nome').value.trim();let cpf=document.getElementById('cpf').value.replace(/\D/g,'');let cidade=document.getElementById('cidade').value.trim();let tel=document.getElementById('tel').value.replace(/\D/g,'');let email=document.getElementById('email').value.trim().toLowerCase();let prof=document.getElementById('prof').value;let usuario=document.getElementById('usuario').value.trim().toLowerCase();let senha=document.getElementById('senha').value;let fotoPerfil=document.getElementById('fotoPerfilUrl').value||document.getElementById('previewPerfil').src;let fotoAnuncio=document.getElementById('fotoAnuncioUrl').value||document.getElementById('previewAnuncio').src||fotoPerfil;let bio=document.getElementById('bio').value;if(cpf.length!==11){toast('CPF 11 digitos');return}let obj={nome:nome,cpf:cpf,cidade:cidade,telefone:tel,whatsapp:'55'+tel,email:email,categoria:prof,profissao:prof,usuario:usuario,senha:senha,foto:fotoPerfil,foto_anuncio:fotoAnuncio,bio:bio,preco:100,plano:'basic',status:'aprovado',created_at:new Date().toISOString(),expira_em:new Date(Date.now()+30*24*60*60*1000).toISOString()};try{let r=await sb.from('profissionais').insert([obj]);if(r.error){toast('Erro:'+r.error.message);return}}catch(err){toast('Erro:'+err.message);return}
try{let msg=`🔔 NOVO CADASTRO - CONTATO CERTO SP\n\n👤 Nome: ${nome}\n💼 Profissão: ${prof}\n📍 Cidade: ${cidade}\n📱 Tel: ${tel}\n👤 Usuário: ${usuario}\n📧 Email: ${email}\n📅 Data: ${new Date().toLocaleString('pt-BR')}\n\nAcesse ADM: https://contatocerto-sp.vercel.app/admin.html`;let url=`https://wa.me/5518991488302?text=${encodeURIComponent(msg)}`;window.open(url,'_blank');}catch(err){}
localStorage.setItem('contatocerto_usuario_logado',usuario);localStorage.setItem('contatocerto_senha_logada',senha);localStorage.setItem('contatocerto_perfil_completo',JSON.stringify(obj));localStorage.setItem('contatocerto_cadastro_feito','1');toast('Cadastro concluído! Notificação enviada ADM');setTimeout(()=>location.href='/index.html',1500)}
</script></body></html>
