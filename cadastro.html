<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro - Contato Certo SP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-[#F8FAFF]">
<main class="max-w-[600px] mx-auto p-4"><div class="bg-[#0F2C59] text-white rounded-[16px] p-5"><h1 class="font-black text-[18px]">Ganhe Ouro 30 dias grátis!</h1><p class="text-[12px] opacity-70">Sem cartão • Ativação imediata</p></div><form onsubmit="cadastrar(event)" class="mt-4 bg-white rounded-[16px] border p-4 grid gap-3">
<input required id="nome" placeholder="Nome completo" class="h-11 px-4 rounded-xl border-2 bg-slate-50"><input required id="cidade" list="cidades" placeholder="Cidade - campo vago - ex: Cândido Mota" class="h-11 px-4 rounded-xl border-2 bg-slate-50"><datalist id="cidades"></datalist><input required id="tel" placeholder="WhatsApp com DDD" class="h-11 px-4 rounded-xl border-2 bg-slate-50"><input required id="email" type="email" placeholder="Email" class="h-11 px-4 rounded-xl border-2 bg-slate-50"><input required id="prof" list="profissoes" placeholder="Profissão - campo vago - ordem alfabética" class="h-11 px-4 rounded-xl border-2 bg-slate-50"><datalist id="profissoes"></datalist><input required id="usuario" placeholder="Usuário" class="h-11 px-4 rounded-xl border-2 bg-slate-50"><input required id="senha" type="password" placeholder="Senha" class="h-11 px-4 rounded-xl border-2 bg-slate-50"><input type="file" id="fotoFile" accept="image/*" class="h-11 px-3 rounded-xl border-2 bg-slate-50 text-[11px]"><img id="preview" src="https://i.pravatar.cc/150" class="w-14 h-14 rounded-full border-2"><textarea required id="bio" placeholder="Descrição do seu serviço" class="p-3 rounded-xl border-2 bg-slate-50 min-h-[70px]"></textarea><button id="btn" class="h-12 rounded-full bg-[#FF7A00] text-white font-black">Finalizar - Ganhar Ouro 30 dias</button></form></main>
<div id="modalOuro" class="fixed inset-0 hidden items-center justify-center p-5"><div class="absolute inset-0 bg-[#0F2C59]/70 backdrop-blur-sm"></div><div class="relative bg-white rounded-[20px] p-7 max-w-[380px] w-full text-center shadow-2xl"><div class="w-12 h-12 rounded-full bg-yellow-100 grid place-items-center text-xl mx-auto">👑</div><h2 class="mt-3 font-black text-[18px] text-[#0F2C59]">Parabéns! Você ganhou Plano Ouro por 30 dias!</h2><p class="text-[13px] text-zinc-600 mt-2">Seu perfil já está no topo. Faça login para ver.</p><button onclick="location.href='/login.html'" class="mt-5 w-full h-11 rounded-full bg-[#0F2C59] text-white font-black">Fazer Login</button></div></div>
<script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb=supabase.createClient(U,K);
const PROFISSOES=["Animador de festa","Boleira","Cantor","Dançarino","Diarista","Doceira","Eletricista","Encanador","Faxineira","Fotógrafo","Gesseiro","Locutor","Montador de móveis","Pedreiro","Personal traine","Pintor","Professor","Radialista","Recepcionista","Salgadeira","Segurança","Técnico de celular","Técnico eletrônico"].sort((a,b)=>a.localeCompare(b,'pt-BR'));
const CIDADES=["Tarumã","Assis","Florinia","Cândido Mota","Platina","Palmital","Maracaí","Paraguaçu Paulista","Echaporã","Ibirarema","Itambaracá (PR)","Andirá (PR)","Bandeirantes (PR)","Cambará (PR)","Santa Mariana (PR)","Sertaneja","Cornélio Procópio","Ourinhos","Marília","Piraju","Ipaussu","Londrina","Chavantes","Santa Cruz do Rio Pardo","Jaú","Avaré","Maringá","Bauru","Barretos","Botucatu"];
document.getElementById('profissoes').innerHTML=PROFISSOES.map(p=>`<option value="${p}">`).join('');
document.getElementById('cidades').innerHTML=CIDADES.map(c=>`<option value="${c}">`).join('');
let fotoFinal="";document.getElementById('fotoFile')?.addEventListener('change',e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=150;c.height=150;c.getContext('2d').drawImage(img,0,0,150,150);fotoFinal=c.toDataURL('image/jpeg',0.7);document.getElementById('preview').src=fotoFinal;};img.src=ev.target.result;};r.readAsDataURL(f);});
async function cadastrar(e){e.preventDefault();let btn=document.getElementById('btn');btn.disabled=true;btn.innerText='Salvando...';let nome=document.getElementById('nome').value,cidade=document.getElementById('cidade').value,tel=document.getElementById('tel').value.replace(/\D/g,''),email=document.getElementById('email').value,prof=document.getElementById('prof').value,usuario=document.getElementById('usuario').value.toLowerCase().replace(/\s/g,''),senha=document.getElementById('senha').value,bio=document.getElementById('bio').value;if(!fotoFinal)fotoFinal='https://i.pravatar.cc/150?u='+usuario;let obj={nome,cidade,telefone:tel,whatsapp:'55'+tel,email,categoria:prof,profissao:prof,usuario,senha,foto:fotoFinal,foto_anuncio:fotoFinal,bio,plano:'ouro',status:'aprovado',created_at:new Date().toISOString(),expira_em:new Date(Date.now()+30*24*60*60*1000).toISOString()};let r=await sb.from('profissionais').insert([obj]).select();if(r.error){alert('Erro: '+r.error.message);btn.disabled=false;btn.innerText='Finalizar - Ganhar Ouro 30 dias';return}document.getElementById('modalOuro').classList.remove('hidden');document.getElementById('modalOuro').classList.add('flex');setTimeout(()=>location.href='/login.html',2500);}
</script></body></html>
