bel class="text-[8px] font-bold">Foto Anuncio - Galeria</label><input type="file" id="fotoAnuncioFile" accept="image/*" class="h-9 px-2 rounded-xl border-2 bg-slate-50 text-[8px] mt-1 w-full"><img id="previewAnuncio" src="https://i.pravatar.cc/150?img=5" class="w-12 h-12 rounded-[10px] border-2 mt-2 object-cover"><div class="text-[7px] text-zinc-500 mt-1">Opcional - se não escolher usa perfil</div></div></div><div><label class="text-[8px] font-bold">Descricao do anuncio *</label><textarea required id="bio" placeholder="Fale do seu serviço" class="p-2 rounded-xl border-2 bg-slate-50 text-[10px] min-h-[70px] mt-1 w-full"></textarea></div><button type="submit" id="btnCad" class="h-11 rounded-xl bg-green-600 text-white font-black text-[11px]">✅ Finalizar Cadastro - Aparece no site na hora + Notifica ADM</button><div id="debug" class="text-[8px] text-zinc-500 mt-2 hidden p-2 bg-zinc-100 rounded-xl"></div></form></div></main><div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-full text-[10px] hidden z-50 text-center max-w-[90%]"></div><script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb;try{sb=supabase.createClient(U,K)}catch(e){}
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),4000)}
let fotoPerfilFinal="";let fotoAnuncioFinal="";
document.getElementById('fotoPerfilFile')?.addEventListener('change',function(e){let file=e.target.files[0];if(!file)return;if(file.size>5*1024*1024){toast('Foto muito grande, use até 5MB');return}comprimirImagem(file,150,150,(base64)=>{fotoPerfilFinal=base64;document.getElementById('previewPerfil').src=base64;});});
document.getElementById('fotoAnuncioFile')?.addEventListener('change',function(e){let file=e.target.files[0];if(!file)return;comprimirImagem(file,300,300,(base64)=>{fotoAnuncioFinal=base64;document.getElementById('previewAnuncio').src=base64;});});
function comprimirImagem(file,w,h,callback){let reader=new FileReader();reader.onload=function(ev){let img=new Image();img.onload=function(){let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);let base64=canvas.toDataURL('image/jpeg',0.7);callback(base64);};img.src=ev.target.result;};reader.readAsDataURL(file);}
async function cadastrar(e){e.preventDefault();let btn=document.getElementById('btnCad');btn.disabled=true;btn.innerText='⏳ Cadastrando... salvando no banco...';let nome=document.getElementById('nome').value.trim();let cpf=document.getElementById('cpf').value.replace(/\D/g,'');let cidade=document.getElementById('cidade').value.trim();let tel=document.getElementById('tel').value.replace(/\D/g,'');let email=document.getElementById('email').value.trim().toLowerCase();let prof=document.getElementById('prof').value;let usuario=document.getElementById('usuario').value.trim().toLowerCase().replace(/\s/g,'');let senha=document.getElementById('senha').value;let bio=document.getElementById('bio').value.trim();if(cpf.length!==11){toast('CPF deve ter 11 números, você digitou '+cpf.length);btn.disabled=false;btn.innerText='✅ Finalizar Cadastro';return}
if(!fotoPerfilFinal){fotoPerfilFinal='https://i.pravatar.cc/150?u='+usuario}
if(!fotoAnuncioFinal){fotoAnuncioFinal=fotoPerfilFinal}
let obj={nome:nome,cpf:cpf,cidade:cidade,telefone:tel,whatsapp:'55'+tel,email:email,categoria:prof,profissao:prof,usuario:usuario,senha:senha,foto:fotoPerfilFinal,foto_anuncio:fotoAnuncioFinal,bio:bio,preco:100,plano:'basic',status:'aprovado',created_at:new Date().toISOString(),expira_em:new Date(Date.now()+30*24*60*60*1000).toISOString(),visualizacoes:Math.floor(Math.random()*50+10),rating:'4.9'};
let debugEl=document.getElementById('debug');debugEl.classList.remove('hidden');debugEl.innerText='Tentando salvar no Supabase...';
try{let r=await sb.from('profissionais').insert([obj]).select();debugEl.innerText='Resposta Supabase: '+JSON.stringify(r).substring(0,500);if(r.error){toast('❌ Erro Supabase: '+r.error.message+' - Veja embaixo');debugEl.innerText='ERRO SUPABASE: '+r.error.message+'\n\nSOLUÇÃO: Vá no Supabase > SQL Editor > rode:\nALTER TABLE profissionais DISABLE ROW LEVEL SECURITY;';btn.disabled=false;btn.innerText='Tentar de novo';return}
if(!r.data||r.data.length===0){toast('⚠️ Inseriu mas não retornou dados - Verifique RLS');}
else{toast('✅ Salvo no Supabase! ID: '+r.data[0].id);}}catch(err){debugEl.innerText='ERRO CATCH: '+err.message;toast('❌ Erro conexão: '+err.message);btn.disabled=false;btn.innerText='Tentar de novo';return}
try{let msg=`🔔 NOVO CADASTRO - CONTATO CERTO SP\n\n👤 Nome: ${nome}\n💼 Profissão: ${prof}\n📍 Cidade: ${cidade}\n📱 Tel: ${tel}\n👤 Usuário: ${usuario}\n📧 Email: ${email}\n📅 Data: ${new Date().toLocaleString('pt-BR')}\n\n✅ JÁ APARECE NO SITE!`;let url=`https://wa.me/5518991488302?text=${encodeURIComponent(msg)}`;window.open(url,'_blank');}catch(err){}
localStorage.setItem('contatocerto_cadastro_feito','1');localStorage.setItem('contatocerto_usuario_logado',usuario);localStorage.setItem('contatocerto_senha_logada',senha);localStorage.setItem('contatocerto_perfil_completo',JSON.stringify(obj));toast('✅ Cadastro concluído e já aparece no site! Redirecionando...');setTimeout(()=>{location.href='/index.html?cadastro=ok&usuario='+usuario},2000)}
</script></body></html>
