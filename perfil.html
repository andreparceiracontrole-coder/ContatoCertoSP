<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Perfil - Contato Certo SP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>html,body{overflow-x:hidden;max-width:100vw}*{box-sizing:border-box}</style></head><body class="bg-[#F8FAFF]">
<header class="bg-white border-b sticky top-0 z-50"><div class="max-w-[800px] mx-auto px-4 h-[64px] flex justify-between items-center"><div class="flex items-center gap-2"><div class="w-9 h-9 rounded-full bg-[#0F2C59] grid place-items-center text-white font-black">C</div><b class="text-[#0F2C59]">Meu Perfil</b></div><nav class="flex gap-2"><a href="/index.html" class="h-8 px-3 rounded-full border text-[12px] font-bold grid place-items-center">Início</a><a href="/planos.html" class="h-8 px-3 rounded-full bg-[#FFD60A] text-[12px] font-bold grid place-items-center">Planos</a><a href="/profissionais.html" class="h-8 px-3 rounded-full bg-[#0F2C59] text-white text-[12px] font-bold grid place-items-center">Profissionais</a></nav></div></header>
<main class="max-w-[700px] mx-auto p-4"><div class="bg-white rounded-[20px] border p-5"><div class="flex justify-between items-center"><h1 class="font-black text-[#0F2C59]">Editar Perfil e Anúncio - 1h</h1><div id="tempo" class="text-[10px] font-bold px-3 py-1 rounded-full bg-zinc-100">Verificando...</div></div>
<div class="mt-4 bg-[#0F2C59] text-white rounded-[16px] p-4 flex gap-3"><div class="relative"><img id="fotoTop" src="https://i.pravatar.cc/150" class="w-14 h-14 rounded-full border-4 border-white object-cover"><div id="seloFoto" class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-zinc-800 border-2 border-white grid place-items-center text-[10px] font-black text-white">B</div></div><div><div id="seloTxt" class="text-[10px] bg-white/20 px-2 py-1 rounded-full inline-block">BASIC</div><div id="nomeTop" class="font-black mt-1">Seu Nome</div><div class="text-[10px] opacity-70">PIN 80% • Fotos galeria • Cidade vaga • Profissão vaga alfabética</div></div></div>
<form onsubmit="salvar(event)" class="mt-5 grid gap-3"><div class="grid md:grid-cols-2 gap-3"><div><label class="text-[10px] font-bold">Nome</label><input required id="nome" placeholder="Nome" class="w-full h-11 px-4 rounded-xl border-2 bg-slate-50"></div><div><label class="text-[10px] font-bold">WhatsApp</label><input required id="tel" placeholder="Telefone" class="w-full h-11 px-4 rounded-xl border-2 bg-slate-50"></div></div><div class="grid md:grid-cols-2 gap-3"><div><label class="text-[10px] font-bold">Cidade - VAGA - 30 cidades pré-configuradas</label><input required id="cidade" list="cidadeList" placeholder="Ex: Cândido Mota, Assis, ou qualquer cidade" class="w-full h-11 px-4 rounded-xl border-2 bg-slate-50"><datalist id="cidadeList"></datalist><div class="text-[9px] text-green-600 font-bold mt-1">✅ Campo vago - aceita qualquer cidade</div></div><div><label class="text-[10px] font-bold">Profissão - VAGA - ordem alfabética</label><input required id="profissao" list="profList" placeholder="Ex: Pedreiro, Eletricista..." class="w-full h-11 px-4 rounded-xl border-2 bg-slate-50"><datalist id="profList"></datalist><div class="text-[9px] text-green-600 font-bold mt-1">✅ Campo vago - aceita qualquer profissão</div></div></div><div><label class="text-[10px] font-bold">Descrição</label><textarea required id="bio" placeholder="Descrição do seu serviço" class="w-full p-3 rounded-xl border-2 bg-slate-50 min-h-[80px]"></textarea></div><div class="grid md:grid-cols-2 gap-3"><div><label class="text-[10px] font-bold">Foto Perfil - Galeria celular - 150x150</label><input type="file" id="fotoPerfilFile" accept="image/*" class="w-full h-11 px-3 rounded-xl border-2 bg-slate-50 text-[11px]"><img id="previewPerfil" src="https://i.pravatar.cc/150" class="mt-2 w-16 h-16 rounded-full border-2 object-cover"></div><div><label class="text-[10px] font-bold">Foto Anúncio - Galeria</label><input type="file" id="fotoAnuncioFile" accept="image/*" class="w-full h-11 px-3 rounded-xl border-2 bg-slate-50 text-[11px]"><img id="previewAnuncio" src="https://i.pravatar.cc/150?img=5" class="mt-2 w-16 h-16 rounded-[12px] border-2 object-cover"></div></div><button id="btnSalvar" class="h-12 rounded-full bg-[#FF7A00] text-white font-black">Salvar Perfil e Anúncio - 1h</button></form></div></main>
<script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb=supabase.createClient(U,K);
const PROFISSOES=["Animador de festa","Boleira","Cantor","Dançarino","Diarista","Doceira","Eletricista","Encanador","Faxineira","Fotógrafo","Gesseiro","Locutor","Montador de móveis","Pedreiro","Personal traine","Pintor","Professor","Radialista","Recepcionista","Salgadeira","Segurança","Técnico de celular","Técnico eletrônico"].sort((a,b)=>a.localeCompare(b,'pt-BR'));
const CIDADES=["Tarumã","Assis","Florinia","Cândido Mota","Platina","Palmital","Maracaí","Paraguaçu Paulista","Echaporã","Ibirarema","Itambaracá (PR)","Andirá (PR)","Bandeirantes (PR)","Cambará (PR)","Santa Mariana (PR)","Sertaneja","Cornélio Procópio","Ourinhos","Marília","Piraju","Ipaussu","Londrina","Chavantes","Santa Cruz do Rio Pardo","Jaú","Avaré","Maringá","Bauru","Barretos","Botucatu"];
document.getElementById('profList').innerHTML=PROFISSOES.map(p=>`<option value="${p}">`).join('');
document.getElementById('cidadeList').innerHTML=CIDADES.map(c=>`<option value="${c}">`).join('');
let perfil=JSON.parse(localStorage.getItem('contatocerto_perfil_completo')||'{}');
if(perfil.nome){document.getElementById('nome').value=perfil.nome;document.getElementById('tel').value=perfil.telefone;document.getElementById('cidade').value=perfil.cidade;document.getElementById('profissao').value=perfil.profissao;document.getElementById('bio').value=perfil.bio||'';document.getElementById('fotoTop').src=perfil.foto;document.getElementById('previewPerfil').src=perfil.foto;document.getElementById('previewAnuncio').src=perfil.foto_anuncio||perfil.foto;document.getElementById('nomeTop').innerText=perfil.nome;document.getElementById('seloTxt').innerText=(perfil.plano||'basic').toUpperCase();}
let fotoPerfil="",fotoAnuncio="";
document.getElementById('fotoPerfilFile')?.addEventListener('change',e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=150;c.height=150;c.getContext('2d').drawImage(img,0,0,150,150);fotoPerfil=c.toDataURL('image/jpeg',0.7);document.getElementById('previewPerfil').src=fotoPerfil;document.getElementById('fotoTop').src=fotoPerfil;};img.src=ev.target.result;};r.readAsDataURL(f);});
document.getElementById('fotoAnuncioFile')?.addEventListener('change',e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=300;c.height=200;c.getContext('2d').drawImage(img,0,0,300,200);fotoAnuncio=c.toDataURL('image/jpeg',0.7);document.getElementById('previewAnuncio').src=fotoAnuncio;};img.src=ev.target.result;};r.readAsDataURL(f);});
function verificarTempo(){let ult=localStorage.getItem('contatocerto_ultima_edicao');let el=document.getElementById('tempo');let btn=document.getElementById('btnSalvar');if(ult){let diff=Math.floor((new Date()-new Date(ult))/1000/60);let rest=60-diff;if(rest>0){el.innerText='Aguarde '+rest+' min - 1h';btn.disabled=true;btn.classList.add('opacity-50');}else{el.innerText='Pode editar agora';btn.disabled=false;btn.classList.remove('opacity-50');}}else{el.innerText='Pode editar agora';}}
async function salvar(e){e.preventDefault();let ult=localStorage.getItem('contatocerto_ultima_edicao');if(ult){let diff=Math.floor((new Date()-new Date(ult))/1000/60);if(diff<60){alert('Só pode editar a cada 1h - aguarde '+(60-diff)+' min');return}}let nome=document.getElementById('nome').value,cidade=document.getElementById('cidade').value,prof=document.getElementById('profissao').value,bio=document.getElementById('bio').value,tel=document.getElementById('tel').value;let update={nome,cidade,profissao:prof,categoria:prof,bio,telefone:tel.replace(/\D/g,'')};if(fotoPerfil)update.foto=fotoPerfil;if(fotoAnuncio)update.foto_anuncio=fotoAnuncio;let r=await sb.from('profissionais').update(update).eq('usuario',perfil.usuario).select();if(r.error){alert('Erro: '+r.error.message);return}localStorage.setItem('contatocerto_perfil_completo',JSON.stringify({...perfil,...update}));localStorage.setItem('contatocerto_ultima_edicao',new Date().toISOString());alert('Perfil atualizado! Selo + PIN maior 80% ok. Próxima edição em 1h.');verificarTempo();}
verificarTempo();
</script></body></html>
