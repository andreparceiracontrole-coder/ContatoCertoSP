<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM - ContatoCertoSP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="icon" href="/icon-192.png"></head><body class="bg-[#F8FAFF]">
<div id="loginBox" class="max-w-[360px] mx-auto mt-24 bg-white rounded-[24px] p-7 border shadow-xl text-center"><img src="/icon-192.png" class="w-12 h-12 mx-auto rounded-xl bg-white border object-contain"><h2 class="mt-4 font-black text-[#0F2C59]">Área Restrita</h2><form onsubmit="loginADM(event)" class="mt-6 grid gap-3"><input id="admU" placeholder="Usuário" class="h-11 px-4 rounded-xl border-2 bg-slate-50"><input id="admP" type="password" placeholder="Senha" class="h-11 px-4 rounded-xl border-2 bg-slate-50"><button class="h-11 rounded-xl bg-[#0F2C59] text-white font-black">Entrar</button></form></div>
<div id="panelBox" class="hidden max-w-[1000px] mx-auto p-6"><div class="flex justify-between"><h2 class="font-black text-[#0F2C59]">Cadastros Tempo Real - ContatoCertoSP</h2><a href="/index.html" class="h-8 px-4 rounded-full border text-[12px] font-bold grid place-items-center">Ver Site</a></div><div id="lista" class="mt-6 grid gap-2"></div></div>
<script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb=supabase.createClient(U,K);
function loginADM(e){e.preventDefault();let u=document.getElementById('admU').value.trim();let p=document.getElementById('admP').value.trim();if(u==='AndreSousa84'&&p==='20112024'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panelBox').classList.remove('hidden');localStorage.setItem('adm_ok','1');carregar();}else{alert('Usuário ou senha incorretos');}}
if(localStorage.getItem('adm_ok')==='1'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panelBox').classList.remove('hidden');carregar();}
async function carregar(){let r=await sb.from('profissionais').select('*').order('created_at',{ascending:false}).limit(100);document.getElementById('lista').innerHTML=r.data.map(x=>`<div class="bg-white border p-3 rounded-xl flex gap-3"><img src="${x.foto||'https://i.pravatar.cc/150'}" class="w-12 h-12 rounded-full"><div><b>${x.nome} - ${x.profissao}</b><div class="text-[11px] text-zinc-600">${x.cidade} - ${new Date(x.created_at).toLocaleString('pt-BR')} - ${x.plano}</div><a href="https://wa.me/${x.whatsapp}" class="text-[11px] text-green-600 font-bold">WhatsApp ${x.telefone}</a></div></div>`).join('');}
</script></body></html>
