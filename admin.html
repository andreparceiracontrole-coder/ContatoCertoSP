<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM - Contato Certo SP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-[#F8FAFF]"><header class="bg-white border-b p-3 flex justify-between max-w-[1100px] mx-auto"><b class="text-[#0F2C59]">ADM Contato Certo SP</b><a href="/index.html" class="h-8 px-4 rounded-full border text-[12px] font-bold grid place-items-center">Início</a></header><div id="loginBox" class="max-w-[380px] mx-auto mt-10 bg-white rounded-[16px] p-6 border shadow"><h2 class="font-black text-[#0F2C59]">Área ADM</h2><form onsubmit="loginADM(event)" class="mt-4 grid gap-3"><input id="admU" placeholder="Usuário" class="h-10 px-3 rounded-xl border-2 bg-slate-50"><input id="admP" type="password" placeholder="Senha" class="h-10 px-3 rounded-xl border-2 bg-slate-50"><button class="h-10 rounded-xl bg-[#0F2C59] text-white font-black">Entrar</button></form></div><div id="panelBox" class="hidden max-w-[1000px] mx-auto p-4"><h2 class="font-black text-[#0F2C59]">Novos cadastros - Tempo Real Supabase</h2><div id="lista" class="mt-4 grid gap-2"></div></div><script>const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb=supabase.createClient(U,K);function loginADM(e){e.preventDefault();if(document.getElementById('admU').value==='AndreSousa84'&&document.getElementById('admP').value==='20112024'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panelBox').classList.remove('hidden');localStorage.setItem('adm_logado','1');carregar();}else{alert('Usuário ou senha incorretos');}}if(localStorage.getItem('adm_logado')==='1'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panelBox').classList.remove('hidden');carregar();}async function carregar(){let r=await sb.from('profissionais').select('*').order('created_at',{ascending:false}).limit(50);document.getElementById('lista').innerHTML=r.data.map(p=>`<div class="bg-white border p-3 rounded-xl flex gap-3"><img src="${p.foto||'https://i.pravatar.cc/150'}" class="w-12 h-12 rounded-full"><div><b>${p.nome} - ${p.profissao}</b><div class="text-[11px] text-zinc-600">${p.cidade} - ${new Date(p.created_at).toLocaleString('pt-BR')} - ${p.plano}</div><a href="https://wa.me/${p.whatsapp}" class="text-[11px] text-green-600 font-bold">WhatsApp</a></div></div>`).join('');}</script></body></html>
