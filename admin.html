<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área ADM - Contato Certo SP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-[#F8FAFF]">
<div id="loginBox" class="max-w-[380px] mx-auto mt-10 bg-white rounded-[16px] p-6 border shadow"><h2 class="font-black text-[16px] text-[#0F2C59]">Área ADM - Acesso Restrito</h2><form onsubmit="loginADM(event)" class="mt-4 grid gap-3"><input id="admU" placeholder="Usuário" class="h-10 px-3 rounded-xl border bg-slate-50"><input id="admP" type="password" placeholder="Senha" class="h-10 px-3 rounded-xl border bg-slate-50"><button class="h-10 rounded-xl bg-[#0F2C59] text-white font-black">Entrar</button></form></div>
<div id="panelBox" class="hidden max-w-[1000px] mx-auto p-4"><div class="flex justify-between"><h2 class="font-black text-[#0F2C59]">Painel ADM - Novos Cadastros</h2><button onclick="localStorage.removeItem('adm_logado');location.reload()" class="text-[12px]">Sair</button></div><div class="mt-4 bg-white rounded-xl border p-4"><div class="flex justify-between"><h3 class="font-bold">🔔 Notificações</h3><span id="notifCount" class="bg-red-600 text-white text-[10px] px-2 py-1 rounded-full">0 novos</span></div><div id="novosUsuarios" class="mt-3 grid gap-2 max-h-[500px] overflow-y-auto"></div></div></div>
<script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb=supabase.createClient(U,K);
function loginADM(e){e.preventDefault();if(document.getElementById('admU').value==='AndreSousa84'&&document.getElementById('admP').value==='20112024'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panelBox').classList.remove('hidden');localStorage.setItem('adm_logado','1');carregarUsuarios();}else{alert('Usuário ou senha incorretos');}}
if(localStorage.getItem('adm_logado')==='1'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panelBox').classList.remove('hidden');carregarUsuarios();}
async function carregarUsuarios(){let r=await sb.from('profissionais').select('*').order('created_at',{ascending:false}).limit(50);document.getElementById('notifCount').innerText=r.data.length+' total';document.getElementById('novosUsuarios').innerHTML=r.data.map(x=>`<div class="border p-3 rounded-xl flex gap-2"><img src="${x.foto||'https://i.pravatar.cc/150'}" class="w-10 h-10 rounded-full"><div><b>${x.nome} - ${x.profissao}</b><div class="text-[11px]">${x.cidade} - @${x.usuario} - ${new Date(x.created_at).toLocaleString('pt-BR')}</div></div></div>`).join('');}
</script></body></html>
