<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área ADM - Contato Certo SP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="icon" href="/icon-192.png"></head><body class="bg-[#F8FAFF]"><header class="bg-white border-b p-3 flex justify-between items-center"><div class="flex items-center gap-2"><img src="/icon-192.png" class="w-8 h-8 rounded-full border-2"><b class="text-[11px]">CONTATO CERTO SP - ADM</b></div><button onclick="location.href='/index.html'" class="px-3 py-1 rounded-full border bg-white text-[10px] font-bold">Início</button></header>
<div id="loginBox" class="max-w-[380px] mx-auto mt-6 bg-white rounded-[14px] p-5 border-2 border-red-200 shadow-xl"><div class="text-center"><div class="w-12 h-12 bg-red-100 rounded-full grid place-items-center text-[20px] mx-auto">🔒</div><h2 class="mt-2 font-black text-[13px]">Área ADM - Acesso Restrito</h2><p class="text-[9px] text-zinc-500 mt-1">Acesso exclusivo para administração</p></div><form onsubmit="loginADM(event)" class="mt-4 grid gap-2"><input id="admU" placeholder="Usuário" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[11px]"><input id="admP" type="password" placeholder="Senha" class="h-9 px-3 rounded-xl border-2 bg-slate-50 text-[11px]"><button type="submit" class="h-9 rounded-xl bg-red-600 text-white font-black text-[11px]">Entrar</button></form></div>
<div id="panelBox" class="hidden max-w-[1000px] mx-auto p-3"><div class="bg-white rounded-[14px] border-2 border-red-200 p-4 shadow"><div class="flex justify-between items-center"><h2 class="font-black text-[13px]">Painel ADM - Gerenciamento</h2><button onclick="localStorage.removeItem('adm_logado');location.reload()" class="h-7 px-3 rounded-full bg-slate-900 text-white text-[9px] font-bold">Sair</button></div>
<div class="mt-4 bg-white rounded-[12px] border-2 border-green-200 p-4 shadow"><div class="flex justify-between items-center"><h3 class="font-black text-[12px]">🔔 Notificações - Novos Cadastros</h3><div id="notifCount" class="bg-red-600 text-white text-[9px] font-black px-2 py-1 rounded-full">0 novos</div></div><div id="novosUsuarios" class="mt-3 grid gap-2 max-h-[500px] overflow-y-auto">Carregando...</div><button onclick="carregarUsuarios()" class="mt-3 w-full h-8 rounded-xl bg-slate-900 text-white text-[10px] font-bold">Atualizar lista</button></div>
<div class="mt-4 bg-slate-900 text-white rounded-xl p-4"><h3 class="font-black text-[12px]">Resumo</h3><div id="resumo" class="mt-2 text-[10px] grid grid-cols-3 gap-2">Carregando...</div></div></div></div>
<script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb;try{sb=supabase.createClient(U,K)}catch(e){}
function loginADM(e){e.preventDefault();let u=document.getElementById('admU').value.trim();let s=document.getElementById('admP').value.trim();if(u==='AndreSousa84'&&s==='20112024'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panelBox').classList.remove('hidden');localStorage.setItem('adm_logado','1');carregarUsuarios();carregarResumo();}else{alert('Usuário ou senha incorretos');}}
if(localStorage.getItem('adm_logado')==='1'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panelBox').classList.remove('hidden');setTimeout(()=>{carregarUsuarios();carregarResumo();},500);}
async function carregarUsuarios(){let div=document.getElementById('novosUsuarios');div.innerHTML='Carregando...';try{let r=await sb.from('profissionais').select('*').order('created_at',{ascending:false}).limit(50);if(r.error){div.innerHTML='Erro: '+r.error.message;return}let hoje=new Date();hoje.setDate(hoje.getDate()-7);let novos=r.data.filter(x=>new Date(x.created_at)>=hoje);document.getElementById('notifCount').innerText=novos.length+' novos (7 dias)';div.innerHTML=r.data.map(x=>{let d=new Date(x.created_at).toLocaleString('pt-BR');let isNovo=new Date(x.created_at)>=hoje;return `<div class="border ${isNovo?'border-green-300 bg-green-50':'border-zinc-200 bg-white'} rounded-xl p-3 flex gap-3"><img src="${x.foto||'https://i.pravatar.cc/150'}" class="w-10 h-10 rounded-full border object-cover"><div class="flex-1"><div class="flex justify-between"><b class="text-[11px]">${x.nome||''} - ${x.profissao||x.categoria||''}</b><span class="text-[8px] ${isNovo?'bg-green-600 text-white px-2 rounded-full':''}">${isNovo?'NOVO':''}</span></div><div class="text-[9px] text-zinc-600">${x.cidade||''} - ${x.telefone||''} - @${x.usuario||''}</div><div class="text-[8px] text-zinc-500">${d} - ${x.plano||'basic'} - ${x.email||''}</div></div></div>`}).join('');}catch(err){div.innerHTML='Erro: '+err.message;}}
async function carregarResumo(){let div=document.getElementById('resumo');try{let r=await sb.from('profissionais').select('plano',{count:'exact'});let total=r.data.length;let ouro=r.data.filter(x=>x.plano==='ouro').length;let basic=r.data.filter(x=>!x.plano||x.plano==='basic').length;div.innerHTML=`<div class="bg-white/10 rounded-lg p-2 text-center"><b>${total}</b><br>Total</div><div class="bg-white/10 rounded-lg p-2 text-center"><b>${ouro}</b><br>Ouro</div><div class="bg-white/10 rounded-lg p-2 text-center"><b>${basic}</b><br>Basic</div>`;}catch(e){div.innerHTML='Erro';}}
</script></body></html>
