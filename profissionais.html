<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profissionais - Contato Certo SP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>html,body{overflow-x:hidden;max-width:100vw}*{box-sizing:border-box}</style></head><body class="bg-[#F8FAFF]">
<header class="bg-white border-b sticky top-0 z-50"><div class="max-w-[1100px] mx-auto px-4 h-[64px] flex justify-between items-center"><div class="flex items-center gap-2"><div class="w-9 h-9 rounded-full bg-[#0F2C59] grid place-items-center text-white font-black">C</div><b class="text-[18px] font-black text-[#0F2C59]">ContatoCerto SP</b></div><nav class="flex gap-2"><a href="/index.html" class="h-9 px-4 rounded-full border-2 border-[#0F2C59] text-[13px] font-bold grid place-items-center">Início</a><a href="/cadastro.html" class="h-9 px-5 rounded-full bg-[#FF7A00] text-white font-black text-[13px] grid place-items-center">Cadastrar</a></nav></div></header>
<main class="max-w-[1100px] mx-auto px-4 pt-6"><div class="bg-white rounded-[20px] border p-6 md:p-8"><h1 class="text-[22px] font-black text-[#0F2C59]">Profissionais em São Paulo e região - Tempo Real</h1><div class="mt-4 flex flex-col md:flex-row gap-2"><input id="buscaProf" list="profissoes" placeholder="Profissão - campo vago" class="flex-[2] h-12 px-4 rounded-full border-2 bg-slate-50"><input id="buscaCidade" list="cidades" placeholder="Cidade - campo vago - ex: Cândido Mota" class="flex-1 h-12 px-4 rounded-full border-2 bg-slate-50"><datalist id="profissoes"></datalist><datalist id="cidades"></datalist><button onclick="carregar()" class="h-12 px-8 rounded-full bg-[#FF7A00] text-white font-black">Buscar</button></div><p class="mt-2 text-[10px] text-green-600 font-bold">✅ Campos vagos - 30 cidades e 23 profissões pré-configuradas mas aceita qualquer valor</p><p id="contador" class="mt-3 text-[12px] font-bold text-[#0F2C59]"></p></div><div id="grid" class="mt-6 grid md:grid-cols-2 lg:grid-cols-3 gap-4">Carregando do Supabase...</div></main>
<script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb=supabase.createClient(U,K);
const PROFISSOES=["Animador de festa","Boleira","Cantor","Dançarino","Diarista","Doceira","Eletricista","Encanador","Faxineira","Fotógrafo","Gesseiro","Locutor","Montador de móveis","Pedreiro","Personal traine","Pintor","Professor","Radialista","Recepcionista","Salgadeira","Segurança","Técnico de celular","Técnico eletrônico"].sort((a,b)=>a.localeCompare(b,'pt-BR'));
const CIDADES=["Tarumã","Assis","Florinia","Cândido Mota","Platina","Palmital","Maracaí","Paraguaçu Paulista","Echaporã","Ibirarema","Itambaracá (PR)","Andirá (PR)","Bandeirantes (PR)","Cambará (PR)","Santa Mariana (PR)","Sertaneja","Cornélio Procópio","Ourinhos","Marília","Piraju","Ipaussu","Londrina","Chavantes","Santa Cruz do Rio Pardo","Jaú","Avaré","Maringá","Bauru","Barretos","Botucatu"];
document.getElementById('profissoes').innerHTML=PROFISSOES.map(p=>`<option value="${p}">`).join('');
document.getElementById('cidades').innerHTML=CIDADES.map(c=>`<option value="${c}">`).join('');
async function carregar(){let g=document.getElementById('grid');g.innerHTML='Buscando...';let prof=document.getElementById('buscaProf').value.trim();let cid=document.getElementById('buscaCidade').value.trim();let q=sb.from('profissionais').select('*').eq('status','aprovado').order('created_at',{ascending:false}).limit(50);if(prof)q=q.ilike('profissao','%'+prof+'%');if(cid)q=q.ilike('cidade','%'+cid+'%');let r=await q;if(r.error){g.innerHTML='Erro: '+r.error.message;return}document.getElementById('contador').innerText=r.data.length+' profissionais encontrados';if(!r.data.length){g.innerHTML='<div class="col-span-full text-center py-10 text-zinc-500">Nenhum profissional encontrado - seja o primeiro em <a href="/cadastro.html" class="text-[#FF7A00] font-bold underline">cadastro.html</a></div>';return}g.innerHTML=r.data.map(p=>`<div class="bg-white rounded-[16px] border p-4 flex gap-3 shadow-sm hover:shadow-md transition"><div class="relative"><img src="${p.foto||'https://i.pravatar.cc/150'}" class="w-[80px] h-[80px] rounded-full border-2 object-cover"><div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-yellow-400 border-2 border-white grid place-items-center text-[10px] font-black">${(p.plano||'B')[0].toUpperCase()}</div></div><div class="flex-1"><b class="text-[13px] text-[#0F2C59]">${p.nome}</b><div class="text-[12px]">${p.profissao} • ${p.cidade}</div><div class="text-[10px] text-zinc-500 line-clamp-2 mt-1">${p.bio||''}</div><div class="mt-2 flex gap-2"><a href="https://wa.me/${p.whatsapp}" target="_blank" class="h-8 px-3 rounded-full bg-[#25D366] text-white text-[11px] font-bold grid place-items-center">WhatsApp</a><a href="https://wa.me/${p.whatsapp}" class="h-8 px-3 rounded-full border text-[11px] font-bold grid place-items-center">Ver perfil</a></div></div></div>`).join('');}
carregar();
</script></body></html>
