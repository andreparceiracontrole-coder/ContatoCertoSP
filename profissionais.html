<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profissionais - ContatoCertoSP</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="icon" href="/icon-192.png"></head><body class="bg-[#F8FAFF]">
<header class="bg-white border-b sticky top-0 z-50"><div class="max-w-[1100px] mx-auto px-4 h-[68px] flex justify-between items-center"><a href="/index.html" class="flex items-center gap-2"><img src="/icon-192.png" class="w-10 h-10 rounded-xl object-contain"><div><div class="font-black"><span class="text-[#0F2C59]">ContatoCerto</span><span class="text-[#FF7A00]">SP</span></div><div class="text-[9px] tracking-widest text-slate-400 font-bold">CÂNDIDO MOTA E REGIÃO</div></div></a><nav class="flex gap-2"><a href="/index.html" class="h-9 px-4 rounded-full border-2 border-[#0F2C59] text-[13px] font-bold grid place-items-center">Início</a><a href="/cadastro.html" class="h-9 px-5 rounded-full bg-[#FF7A00] text-white font-black">Cadastrar</a></nav></div></header>
<main class="max-w-[1100px] mx-auto px-4 py-6"><div class="bg-white rounded-[20px] border p-6"><h1 class="font-black text-[#0F2C59] text-[20px]">Profissionais - Tempo Real Supabase</h1><div class="mt-4 flex gap-2"><input id="bProf" list="profL" placeholder="Profissão - campo vago" class="flex-1 h-12 px-4 rounded-full border-2 bg-slate-50"><input id="bCid" list="cidL" placeholder="Cidade - campo vago" class="flex-1 h-12 px-4 rounded-full border-2 bg-slate-50"><button onclick="carregar()" class="h-12 px-6 rounded-full bg-[#FF7A00] text-white font-black">Buscar</button></div><datalist id="profL"></datalist><datalist id="cidL"></datalist><p id="cont" class="mt-3 text-[12px] font-bold"></p></div><div id="grid" class="mt-6 grid md:grid-cols-3 gap-4">Carregando...</div></main>
<script>
const U="https://rjrcdikhpvlrvivvqmlb.supabase.co";const K="sb_publishable_1fCXyxX4f7WyO64N9HBEVg_2AZeGTtL";let sb=supabase.createClient(U,K);
const PROF=["Animador de festa","Boleira","Cantor","Dançarino","Diarista","Doceira","Eletricista","Encanador","Faxineira","Fotógrafo","Gesseiro","Locutor","Montador de móveis","Pedreiro","Personal traine","Pintor","Professor","Radialista","Recepcionista","Salgadeira","Segurança","Técnico de celular","Técnico eletrônico"].sort((a,b)=>a.localeCompare(b,'pt-BR'));
const CIDS=["Tarumã","Assis","Florinia","Cândido Mota","Platina","Palmital","Maracaí","Paraguaçu Paulista","Echaporã","Ibirarema","Itambaracá (PR)","Andirá (PR)","Bandeirantes (PR)","Cambará (PR)","Santa Mariana (PR)","Sertaneja","Cornélio Procópio","Ourinhos","Marília","Piraju","Ipaussu","Londrina","Chavantes","Santa Cruz do Rio Pardo","Jaú","Avaré","Maringá","Bauru","Barretos","Botucatu"];
document.getElementById('profL').innerHTML=PROF.map(p=>`<option value="${p}">`).join('');document.getElementById('cidL').innerHTML=CIDS.map(c=>`<option value="${c}">`).join('');
async function carregar(){let g=document.getElementById('grid');let pr=document.getElementById('bProf').value,cid=document.getElementById('bCid').value;let q=sb.from('profissionais').select('*').eq('status','aprovado').order('created_at',{ascending:false}).limit(50);if(pr)q=q.ilike('profissao','%'+pr+'%');if(cid)q=q.ilike('cidade','%'+cid+'%');let r=await q;document.getElementById('cont').innerText=r.data.length+' encontrados';g.innerHTML=r.data.map(p=>`<div class="bg-white border p-4 rounded-[16px] flex gap-3"><img src="${p.foto||'https://i.pravatar.cc/150'}" class="w-16 h-16 rounded-full"><div><b class="text-[13px] text-[#0F2C59]">${p.nome} - ${p.profissao}</b><div class="text-[11px]">${p.cidade}</div><a href="https://wa.me/${p.whatsapp}" class="mt-2 inline-block h-8 px-3 rounded-full bg-[#25D366] text-white text-[11px] font-bold leading-8">WhatsApp</a></div></div>`).join('');}
carregar();
</script></body></html>
